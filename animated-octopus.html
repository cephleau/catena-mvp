<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Octopus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .octopus-container {
            position: relative;
            width: 600px;
            height: 600px;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 20px 40px rgba(255, 107, 26, 0.2));
        }

        /* Body breathing animation */
        @keyframes breathe {
            0%, 100% {
                transform: scaleY(1);
            }
            50% {
                transform: scaleY(1.05);
            }
        }

        /* Tentacle sway animations */
        @keyframes sway1 {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(3deg);
            }
            75% {
                transform: rotate(-3deg);
            }
        }

        @keyframes sway2 {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-2deg);
            }
            75% {
                transform: rotate(4deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        /* Eye blink */
        @keyframes blink {
            0%, 49%, 100% {
                transform: scaleY(1);
            }
            50% {
                transform: scaleY(0.1);
            }
        }

        .octopus-body {
            animation: breathe 2s ease-in-out infinite;
            transform-origin: center;
        }

        .tentacle-1 { animation: sway1 3s ease-in-out infinite; transform-origin: 300px 150px; }
        .tentacle-2 { animation: sway2 3.2s ease-in-out infinite 0.2s; transform-origin: 350px 160px; }
        .tentacle-3 { animation: sway1 3.4s ease-in-out infinite 0.4s; transform-origin: 380px 200px; }
        .tentacle-4 { animation: sway2 3.6s ease-in-out infinite 0.6s; transform-origin: 380px 250px; }
        .tentacle-5 { animation: sway1 3.4s ease-in-out infinite 0.8s; transform-origin: 350px 300px; }
        .tentacle-6 { animation: sway2 3.2s ease-in-out infinite 1s; transform-origin: 300px 310px; }
        .tentacle-7 { animation: sway1 3s ease-in-out infinite 1.2s; transform-origin: 250px 300px; }
        .tentacle-8 { animation: sway2 3.2s ease-in-out infinite 1.4s; transform-origin: 220px 250px; }

        .left-eye { animation: blink 4s ease-in-out infinite; transform-origin: 250px 140px; }
        .right-eye { animation: blink 4s ease-in-out infinite 0.1s; transform-origin: 350px 140px; }

        .suckers {
            animation: pulse 2s ease-in-out infinite;
        }

        .info {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
            width: 100%;
        }

        .plugins-panel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 31, 58, 0.9);
            border-top: 2px solid #ff0096;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.3);
        }

        .plugin-btn {
            background: linear-gradient(135deg, #ff0096, #ff6b00);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .plugin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 0, 150, 0.4);
        }

        .plugin-btn:active {
            transform: translateY(-1px);
        }

        .plugin-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.4s;
        }

        .plugin-btn:hover::before {
            left: 100%;
        }

        .status-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 31, 58, 0.95);
            color: #ff0096;
            padding: 30px 40px;
            border-radius: 8px;
            border: 2px solid #ff0096;
            z-index: 1000;
            text-align: center;
            font-weight: 600;
            animation: slideUp 0.4s ease-out;
            display: none;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translate(-50%, -40%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            color: #4CAF50;
            border-color: #4CAF50;
        }

        .status-message.error {
            color: #ff6b00;
            border-color: #ff6b00;
        }

        .copy-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff6b00;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #ff0096;
            transform: scale(1.05);
        }

        .downloaded {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <button class="copy-btn" onclick="downloadSVG()">Download SVG</button>

    <div class="octopus-container">
        <svg id="octopusSVG" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
            <!-- Background glow -->
            <defs>
                <radialGradient id="bodyGradient" cx="50%" cy="30%">
                    <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:1" />
                    <stop offset="70%" style="stop-color:#ff0096;stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#1a0033;stop-opacity:0.8" />
                </radialGradient>

                <linearGradient id="tentacleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff0096;stop-opacity:0.7" />
                </linearGradient>

                <filter id="glow">
                    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- Main body -->
            <g class="octopus-body">
                <!-- Head/body circle -->
                <circle cx="300" cy="150" r="90" fill="url(#bodyGradient)" filter="url(#glow)" />

                <!-- Cheeks (subtle) -->
                <circle cx="240" cy="170" r="30" fill="#ff6b00" opacity="0.4" />
                <circle cx="360" cy="170" r="30" fill="#ff6b00" opacity="0.4" />
            </g>

            <!-- TENTACLES (8 total) -->
            <!-- Tentacle 1 (top-right) -->
            <g class="tentacle-1">
                <path d="M 330 235 Q 360 280 365 370 Q 368 420 360 480 Q 355 520 340 560" 
                      stroke="url(#tentacleGradient)" stroke-width="35" fill="none" 
                      stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
                <g class="suckers">
                    <circle cx="365" cy="300" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="368" cy="350" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="365" cy="400" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="360" cy="450" r="8" fill="#1a0033" opacity="0.6" />
                </g>
            </g>

            <!-- Tentacle 2 (right) -->
            <g class="tentacle-2">
                <path d="M 365 200 Q 420 220 480 240 Q 530 250 570 260" 
                      stroke="url(#tentacleGradient)" stroke-width="32" fill="none" 
                      stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
                <g class="suckers">
                    <circle cx="420" cy="220" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="470" cy="240" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="520" cy="250" r="8" fill="#1a0033" opacity="0.6" />
                </g>
            </g>

            <!-- Tentacle 3 (right-down) -->
            <g class="tentacle-3">
                <path d="M 380 210 Q 450 230 510 310 Q 540 350 555 400" 
                      stroke="url(#tentacleGradient)" stroke-width="30" fill="none" 
                      stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
                <g class="suckers">
                    <circle cx="450" cy="250" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="500" cy="310" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="535" cy="360" r="8" fill="#1a0033" opacity="0.6" />
                </g>
            </g>

            <!-- Tentacle 4 (bottom-right) -->
            <g class="tentacle-4">
                <path d="M 350 235 Q 400 300 420 380 Q 430 450 410 530" 
                      stroke="url(#tentacleGradient)" stroke-width="33" fill="none" 
                      stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
                <g class="suckers">
                    <circle cx="390" cy="310" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="415" cy="390" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="415" cy="450" r="8" fill="#1a0033" opacity="0.6" />
                </g>
            </g>

            <!-- Tentacle 5 (bottom-left) -->
            <g class="tentacle-5">
                <path d="M 250 235 Q 200 300 180 380 Q 170 450 190 530" 
                      stroke="url(#tentacleGradient)" stroke-width="33" fill="none" 
                      stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
                <g class="suckers">
                    <circle cx="210" cy="310" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="185" cy="390" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="185" cy="450" r="8" fill="#1a0033" opacity="0.6" />
                </g>
            </g>

            <!-- Tentacle 6 (left-down) -->
            <g class="tentacle-6">
                <path d="M 270 235 Q 200 230 140 310 Q 110 350 95 400" 
                      stroke="url(#tentacleGradient)" stroke-width="30" fill="none" 
                      stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
                <g class="suckers">
                    <circle cx="200" cy="250" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="140" cy="310" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="105" cy="360" r="8" fill="#1a0033" opacity="0.6" />
                </g>
            </g>

            <!-- Tentacle 7 (left) -->
            <g class="tentacle-7">
                <path d="M 235 200 Q 180 220 120 240 Q 70 250 30 260" 
                      stroke="url(#tentacleGradient)" stroke-width="32" fill="none" 
                      stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
                <g class="suckers">
                    <circle cx="180" cy="220" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="130" cy="240" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="80" cy="250" r="8" fill="#1a0033" opacity="0.6" />
                </g>
            </g>

            <!-- Tentacle 8 (top-left) -->
            <g class="tentacle-8">
                <path d="M 270 235 Q 240 280 235 370 Q 232 420 240 480 Q 245 520 260 560" 
                      stroke="url(#tentacleGradient)" stroke-width="35" fill="none" 
                      stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
                <g class="suckers">
                    <circle cx="235" cy="300" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="232" cy="350" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="235" cy="400" r="8" fill="#1a0033" opacity="0.6" />
                    <circle cx="240" cy="450" r="8" fill="#1a0033" opacity="0.6" />
                </g>
            </g>

            <!-- EYES -->
            <!-- Left eye -->
            <g class="left-eye">
                <circle cx="250" cy="140" r="18" fill="white" />
                <circle cx="250" cy="140" r="12" fill="#1a0033" />
                <circle cx="252" cy="136" r="5" fill="white" opacity="0.8" />
            </g>

            <!-- Right eye -->
            <g class="right-eye">
                <circle cx="350" cy="140" r="18" fill="white" />
                <circle cx="350" cy="140" r="12" fill="#1a0033" />
                <circle cx="352" cy="136" r="5" fill="white" opacity="0.8" />
            </g>

            <!-- Mouth (cute smile) -->
            <path d="M 280 180 Q 300 195 320 180" stroke="#1a0033" stroke-width="3" fill="none" stroke-linecap="round" />
        </svg>

        <div class="info">
            Click a plugin or move your mouse over the octopus
        </div>

        <div class="plugins-panel">
            <button class="plugin-btn" onclick="runPlugin('code-review')">
                🔍 Code Review
            </button>
            <button class="plugin-btn" onclick="runPlugin('security-review')">
                🔐 Security Review
            </button>
            <button class="plugin-btn" onclick="runPlugin('claude-mem')">
                🧠 Claude Mem
            </button>
            <button class="plugin-btn" onclick="runPlugin('plan-ceo-review')">
                📋 Plan CEO Review
            </button>
        </div>
    </div>

    <div class="status-message" id="statusMsg"></div>

    <script>
        const pluginConfig = {
            'code-review': {
                name: 'Code Review',
                icon: '🔍',
                description: 'Analyzing code for quality, patterns, and best practices...',
                command: '/code-review',
                delay: 2000
            },
            'security-review': {
                name: 'Security Review',
                icon: '🔐',
                description: 'Running security scan and vulnerability assessment...',
                command: '/security-review',
                delay: 2500
            },
            'claude-mem': {
                name: 'Claude Memory',
                icon: '🧠',
                description: 'Accessing memory system and context...',
                command: '/claude-mem',
                delay: 1500
            },
            'plan-ceo-review': {
                name: 'CEO Plan Review',
                icon: '📋',
                description: 'Preparing strategic plan review...',
                command: '/plan-ceo-review',
                delay: 2200
            }
        };

        function showStatus(message, type = 'info') {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = message;
            statusMsg.className = `status-message show ${type}`;

            setTimeout(() => {
                statusMsg.classList.remove('show');
            }, 3000);
        }

        function runPlugin(pluginKey) {
            const plugin = pluginConfig[pluginKey];
            if (!plugin) return;

            // Show initial message
            showStatus(`${plugin.icon} ${plugin.description}`, 'info');

            // Animate octopus
            const octopus = document.querySelector('.octopus-body');
            octopus.style.animation = 'none';
            setTimeout(() => {
                octopus.style.animation = 'breathe 1s ease-in-out infinite';
            }, 10);

            // Simulate plugin execution
            setTimeout(() => {
                showStatus(`✓ ${plugin.name} Complete!`, 'success');
                
                // Log to console
                console.log(`[${new Date().toLocaleTimeString()}] Executed: ${plugin.command}`);
                
                // Try to send to OpenClaw if available
                if (window.openclaw) {
                    try {
                        window.openclaw.exec(plugin.command);
                    } catch (e) {
                        console.log(`Plugin ${pluginKey} triggered (offline mode)`);
                    }
                }
            }, plugin.delay);
        }

        function downloadSVG() {
            const svg = document.getElementById('octopusSVG');
            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = function() {
                canvas.width = 600;
                canvas.height = 600;
                ctx.fillStyle = 'transparent';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);

                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'animated-octopus.png';
                link.click();
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
        }

        // Mouse interaction
        const octopusContainer = document.querySelector('.octopus-container');
        octopusContainer.addEventListener('mousemove', (e) => {
            const rect = octopusContainer.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;

            // Subtle tilt effect
            const tiltX = (y - 0.5) * 5;
            const tiltY = (x - 0.5) * 5;
            
            octopusContainer.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
        });

        octopusContainer.addEventListener('mouseleave', () => {
            octopusContainer.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            const shortcuts = {
                'c': 'code-review',
                's': 'security-review',
                'm': 'claude-mem',
                'p': 'plan-ceo-review'
            };

            if (shortcuts[e.key]) {
                runPlugin(shortcuts[e.key]);
            }
        });

        console.log('%c🐙 Octopus Control Panel Ready', 'color: #ff0096; font-size: 16px; font-weight: bold;');
        console.log('%cKeyboard shortcuts:', 'color: #ff6b00; font-weight: bold;');
        console.log('Press C for Code Review');
        console.log('Press S for Security Review');
        console.log('Press M for Claude Memory');
        console.log('Press P for CEO Plan Review');
    </script>
</body>
</html>
