<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catena LP — MVP Launch Kanban</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .header p {
            color: #666;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #f5f5f5;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-box strong {
            color: #333;
            display: block;
        }

        .stat-box span {
            color: #666;
            font-size: 14px;
        }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .column {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            max-height: 85vh;
        }

        .column-header {
            padding: 20px;
            border-bottom: 2px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-header h2 {
            font-size: 18px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .column-count {
            background: #f0f0f0;
            color: #666;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .column-body {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .column-body::-webkit-scrollbar {
            width: 6px;
        }

        .column-body::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .column-body::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .task-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px;
            cursor: move;
            transition: all 0.2s;
            border-left: 4px solid #667eea;
        }

        .task-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .task-card.dragging {
            opacity: 0.5;
        }

        .task-card.critical {
            border-left-color: #e74c3c;
            background: #fff5f5;
        }

        .task-card.high {
            border-left-color: #f39c12;
            background: #fffbf0;
        }

        .task-card.medium {
            border-left-color: #3498db;
            background: #f0f8ff;
        }

        .task-card.low {
            border-left-color: #27ae60;
            background: #f0fff4;
        }

        .task-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .task-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .task-badge {
            background: white;
            color: #666;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid #ddd;
        }

        .task-priority {
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        .task-priority.critical {
            background: #e74c3c;
            color: white;
        }

        .task-priority.high {
            background: #f39c12;
            color: white;
        }

        .task-priority.medium {
            background: #3498db;
            color: white;
        }

        .task-priority.low {
            background: #27ae60;
            color: white;
        }

        .task-owner {
            color: #7f8c8d;
            font-size: 12px;
        }

        .drop-zone {
            min-height: 500px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .drop-zone.drag-over {
            background: #e8f4f8;
            border: 2px dashed #667eea;
        }

        .footer {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            color: #666;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .footer small {
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .kanban-board {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }

            .stats {
                flex-direction: column;
            }
        }

        .emoji {
            font-size: 18px;
        }
    </style>
</head>
<body>

                    <span class="column-count" id="progress-col-count">2</span>
                </div>
                <div class="column-body drop-zone" id="progress-column" data-status="in-progress">
                    <!-- Tasks will be inserted here -->
                </div>
            </div>

            <!-- DONE COLUMN -->
            <div class="column">

                    <span class="column-count" id="done-col-count">7</span>
                </div>
                <div class="column-body drop-zone" id="done-column" data-status="done">

        </div>

        <div class="footer">
            <small>💡 Drag & drop cards between columns. Updates are saved automatically.</small>
        </div>
    </div>

            // TO DO - TECH INFRA
            { id: 12, title: "Setup GitHub repo (catenalanguagepartners)", status: "todo", priority: "critical", owner: "Sub-agent", category: "Tech (Infra)", due: "2026-04-01" },
            { id: 13, title: "Design Supabase schema (interpreters, clients, bookings, payments)", status: "todo", priority: "critical", owner: "Sub-agent", category: "Tech (Infra)", due: "2026-04-03" },
            { id: 14, title: "Setup Netlify deployment (auto from GitHub)", status: "todo", priority: "high", owner: "Sub-agent", category: "Tech (Infra)", due: "2026-04-03" },

            // TO DO - BUSINESS/LEGAL

            // DONE

            { id: 50, title: "RACI matrix (roles & responsibilities)", status: "done", priority: "high", owner: "Carlos", category: "Planning/Docs" },

            { id: 53, title: "Process flowcharts (client, interpreter, QA, finance, escalation)", status: "done", priority: "high", owner: "Carlos", category: "Planning/Docs" },
            { id: 54, title: "Operating procedures (8 SOPs for launch)", status: "done", priority: "high", owner: "Carlos", category: "Planning/Docs" },
            { id: 55, title: "Kanban board (this tracker)", status: "done", priority: "medium", owner: "Carlos", category: "Planning/Docs" },
        ];

        // Initialize board
        function initBoard() {
            renderTasks();
            setupDragAndDrop();
            updateStats();
        }

        function renderTasks() {
            const todo = document.getElementById('todo-column');
            const progress = document.getElementById('progress-column');
            const done = document.getElementById('done-column');

            todo.innerHTML = '';
            progress.innerHTML = '';
            done.innerHTML = '';

            tasks.forEach(task => {
                const card = createTaskCard(task);
                if (task.status === 'todo') todo.appendChild(card);
                else if (task.status === 'in-progress') progress.appendChild(card);
                else if (task.status === 'done') done.appendChild(card);
            });
        }

        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = `task-card ${task.priority}`;
            card.draggable = true;
            card.dataset.taskId = task.id;

            let html = `
                <div class="task-title">${task.title}</div>
                <div class="task-meta">
                    <span class="task-priority ${task.priority}">${task.priority.toUpperCase()}</span>
                    <span class="task-badge">${task.owner}</span>
                    <span class="task-badge">${task.due}</span>
            `;
            if (task.note) html += `<span class="task-badge">📝 ${task.note}</span>`;
            html += `</div>`;
            card.innerHTML = html;

            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);

            return card;
        }

        let draggedCard = null;

        function handleDragStart(e) {
            draggedCard = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            draggedCard = null;
        }

        function setupDragAndDrop() {
            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.addEventListener('dragover', handleDragOver);
                zone.addEventListener('dragleave', handleDragLeave);
                zone.addEventListener('drop', handleDrop);
            });
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');

            if (draggedCard) {
                const taskId = parseInt(draggedCard.dataset.taskId);
                const newStatus = this.dataset.status;
                const task = tasks.find(t => t.id === taskId);
                if (task) {
                    task.status = newStatus;
                    renderTasks();
                    setupDragAndDrop();
                    updateStats();
                }
            }
        }

        function updateStats() {
            const todo = tasks.filter(t => t.status === 'todo').length;
            const progress = tasks.filter(t => t.status === 'in-progress').length;
            const done = tasks.filter(t => t.status === 'done').length;
            const total = tasks.length;
            const pct = Math.round((done / total) * 100);

            document.getElementById('todo-count').textContent = todo;
            document.getElementById('progress-count').textContent = progress;
            document.getElementById('done-count').textContent = done;
            document.getElementById('total-tasks').textContent = total;
            document.getElementById('progress-pct').textContent = pct + '%';

            document.getElementById('todo-col-count').textContent = todo;
            document.getElementById('progress-col-count').textContent = progress;
            document.getElementById('done-col-count').textContent = done;
        }

        // Load on page load
        window.addEventListener('load', initBoard);
    </script>
</body>
</html>
