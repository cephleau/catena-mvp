[build]
  command = "npm run build && mkdir -p .next/public && cp -r public/* .next/public/"
  publish = ".next"

# Serve public files
[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_ENV = "production"
  NPM_FLAGS = "--production=false"
